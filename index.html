<!DOCTYPE html>
<html>

<head>
    <title>LaffPak</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ff2f63">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LaffPak">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #242424 0%, #111 70%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
        }

        .landingCard {
            width: 100%;
            max-width: 420px;
            background-color: #1f1f1f;
            border-radius: 28px;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.65);
        }

        .logo {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #333;
            margin-bottom: 18px;
            background-color: #ff0040;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 10px 0;
        }

        .subtitle {
            color: #ccc;
            font-size: 15px;
            line-height: 1.45;
            margin-bottom: 24px;
        }

        .installButton {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background-color: #ff2f63;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .secondaryButton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background-color: #333;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .instructions {
            margin-top: 18px;
            color: #aaa;
            font-size: 13px;
            line-height: 1.45;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="landingCard">
        <img class="logo" src="LaffPak Logo.jpg" alt="LaffPak Logo">

        <h1>LaffPak</h1>

        <div class="subtitle">
            LaffPak is a reaction meme database and organization tool built for fast scrolling,
            saving, sharing, and discovering the perfect meme for any moment.
        </div>

        <button id="installButton" class="installButton">
            Add LaffPak to Home Screen
        </button>

        <button id="openAppButton" class="secondaryButton hidden">
            Open LaffPak
        </button>

        <div id="instructions" class="instructions">
            For best experience, install LaffPak to your home screen.
            <br><br>
            On iPhone: tap Share, then tap Add to Home Screen.
        </div>
    </div>

    <script>
        let deferredPrompt = null;

        const installButton = document.getElementById("installButton");
        const openAppButton = document.getElementById("openAppButton");
        const instructions = document.getElementById("instructions");

        function isStandaloneMode() {
            return (
                window.matchMedia("(display-mode: standalone)").matches ||
                window.navigator.standalone === true
            );
        }

        if (isStandaloneMode()) {
            window.location.href = "app.html";
        }

        window.addEventListener("beforeinstallprompt", function (event) {
            event.preventDefault();
            deferredPrompt = event;
            installButton.textContent = "Install LaffPak";
        });

        installButton.addEventListener("click", async function () {
            if (deferredPrompt) {
                deferredPrompt.prompt();

                const choiceResult = await deferredPrompt.userChoice;
                deferredPrompt = null;

                if (choiceResult.outcome === "accepted") {
                    instructions.innerHTML = "LaffPak was installed. Open it from your home screen.";
                    openAppButton.classList.remove("hidden");
                }
            } else {
                instructions.innerHTML = `
                    On iPhone Safari:<br><br>
                    1. Tap the Share button<br>
                    2. Tap Add to Home Screen<br>
                    3. Open LaffPak from your home screen
                `;
            }
        });

        openAppButton.addEventListener("click", function () {
            window.location.href = "app.html";
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js");
        }
    </script>

    <script>
        document.addEventListener("gesturestart", function (event) {
            event.preventDefault();
        });

        document.addEventListener("dblclick", function (event) {
            event.preventDefault();
        });
    </script>

</body>

</html>
